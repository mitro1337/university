<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Formatare Text HTML</title>
</head>
<body>
    <h2>Etichete de formatare a textului:</h2>
    <p><b>Invat limbajul HTML.</b></p>
    <p><i>Exersez limbajul HTML.</i></p>
    <p><u>Stiu limbajul HTML.</u></p>
    <p>Text normal cu <b>bold</b>, <i>italic</i> si <u>subliniat</u>.</p>
</body>
</html>
