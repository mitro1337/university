<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Formular date (Metoda GET)</title>
</head>
<body>
    <h2>Formular preluare date - Metoda GET</h2>
    <hr>
    
    <!-- Metoda GET trimite datele prin sirul de interogare (query string) in URL -->
    <form action="pagina.php" method="GET">
        <label for="nume">Nume:</label>
        <input type="text" name="nume" id="nume" required>
        <input type="submit" value="Trimite (GET)">
    </form>
    
    <p><small>Observatie: dupa apasarea butonului, verificati bara de adrese a browserului (URL-ul va contine ?nume=...)</small></p>
</body>
</html>
