<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cautare pe motorul Bing</title>
</head>
<body>
    <h2>Cautare pe motorul Bing</h2>
    <hr>
    
    <form action="https://www.bing.com/search" method="GET" target="_blank">
        <label for="q"><b>Expresie de cautat:</b></label><br>
        <input type="text" name="q" id="q" size="35" placeholder="Introduceti termenul..." required>
        <input type="submit" value="Cauta pe Bing">
    </form>
    
    <p><small>Observatie: Motorul Bing asteapta parametrul GET numit <code>q</code>.</small></p>
</body>
</html>
