<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pagina cu liste</title>
</head>
<body>
    <h2>Aceasta pagina exemplifica crearea listelor</h2>
    <hr>
    
    <p>Cele mai uzual folosite tipuri de liste sunt:</p>
    <ul>
        <li>neordonate</li>
        <li>ordonate</li>
    </ul>

    <p>O lista ordonata este o lista numerotata:</p>
    <ol>
        <li>primul element;</li>
        <li>al doilea element;</li>
        <li>al treilea element.</li>
    </ol>
</body>
</html>
