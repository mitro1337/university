<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Probleme propuse: Tabel</title>
</head>
<body>
    <h2>Probleme propuse: Tabele</h2>
    <hr>
    
    <h3>1. Un tabel format din 4 linii si 2 coloane (fara chenar):</h3>
    <table cellpadding="6" cellspacing="2">
        <tr>
            <td>cell 11</td>
            <td>cell 12</td>
        </tr>
        <tr>
            <td>cell 21</td>
            <td>cell 22</td>
        </tr>
        <tr>
            <td>cell 31</td>
            <td>cell 32</td>
        </tr>
        <tr>
            <td>cell 41</td>
            <td>cell 42</td>
        </tr>
    </table>

    <br><br>
    <h3>2. Un tabel format din 4 linii si 2 coloane cu chenar (border="1"):</h3>
    <table border="1" cellpadding="6" cellspacing="2">
        <tr>
            <td>cell 11</td>
            <td>cell 12</td>
        </tr>
        <tr>
            <td>cell 21</td>
            <td>cell 22</td>
        </tr>
        <tr>
            <td>cell 31</td>
            <td>cell 32</td>
        </tr>
        <tr>
            <td>cell 41</td>
            <td>cell 42</td>
        </tr>
    </table>
</body>
</html>
