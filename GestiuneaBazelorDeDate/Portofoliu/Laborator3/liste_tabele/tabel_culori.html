<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tabel cu Culori si Dimensiuni Fixe</title>
</head>
<body>
    <h2>Problema rezolvata 8: Tabel 2x2 cu culori de fond</h2>
    <hr>
    
    <table border="1" cellpadding="10" cellspacing="2">
        <tr>
            <td width="80" bgcolor="#FF0000" align="center">
                <font color="#FFFFFF"><b>rosu</b></font>
            </td>
            <td width="160" bgcolor="#FFFF00" align="center">
                <font color="#000000"><b>galben</b></font>
            </td>
        </tr>
        <tr>
            <td width="80" bgcolor="#FFFFFF" align="center">
                <font color="#000000"><b>alb</b></font>
            </td>
            <td width="160" bgcolor="#008000" align="center">
                <font color="#FFFFFF"><b>verde</b></font>
            </td>
        </tr>
    </table>
</body>
</html>
