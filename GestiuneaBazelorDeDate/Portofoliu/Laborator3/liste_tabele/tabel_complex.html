<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Problema rezolvata 9: Tabel cu Colspan si Rowspan</title>
</head>
<body>
    <h2>Problema rezolvata 9: Tabel avansat cu imbinare de celule</h2>
    <hr>
    
    <table border="1" cellpadding="8" cellspacing="2" align="center">
        <caption align="top"><b>Tabel de lucru</b></caption>
        
        <!-- Capul de tabel (afisat centrat implicit de <th>) -->
        <tr bgcolor="#E0E0E0">
            <th>Titlul 1</th>
            <th>Titlul 2</th>
            <th>Titlul 3</th>
            <th>Titlul 4</th>
        </tr>

        <!-- Randul 1: 4 celule obisnuite -->
        <tr align="center">
            <td>R1 C1</td>
            <td>R1 C2</td>
            <td>R1 C3</td>
            <td>R1 C4</td>
        </tr>

        <!-- Randul 2: celulele 1 si 2 sunt unite prin colspan="2" -->
        <tr align="center">
            <td colspan="2" bgcolor="#FFF3CD"><b>R2 C1+C2 (colspan)</b></td>
            <td>R2 C3</td>
            <td>R2 C4</td>
        </tr>

        <!-- Randul 3: celula 1 unita pe verticala prin rowspan="2" -->
        <tr align="center">
            <td rowspan="2" bgcolor="#D1E7DD"><b>R3 C1 + R4 C1<br>(rowspan)</b></td>
            <td>R3 C2</td>
            <td>R3 C3</td>
            <td>R3 C4</td>
        </tr>

        <!-- Randul 4: celula 1 este deja acoperita de rowspan-ul de la Randul 3 -->
        <tr align="center">
            <td>R4 C2</td>
            <td>R4 C3</td>
            <td>R4 C4</td>
        </tr>
    </table>
</body>
</html>
