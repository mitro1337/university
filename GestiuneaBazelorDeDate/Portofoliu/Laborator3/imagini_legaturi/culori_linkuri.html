<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Culori pentru legaturi</title>
</head>
<!-- link = nevizitate (albastru), vlink = vizitate (verde), alink = active (rosu) -->
<body link="#0000FF" vlink="#008000" alink="#FF0000">
    <h2>Setarea culorilor pentru link-uri:</h2>
    <p><b>rosu</b> pentru legaturi active, <b>verde</b> pentru legaturi vizitate şi <b>albastru</b> pentru legaturi nevizitate.</p>
    <hr>
    
    <p><a href="#pagina1">Link catre pagina 1</a></p>
    <p><a href="#pagina2">Link catre pagina 2</a></p>
    <p><a href="https://www.google.ro">Link catre pagina 3 (site extern)</a></p>
</body>
</html>
