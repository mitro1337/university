version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: linearflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: workflow_management
      MYSQL_USER: linearflow
      MYSQL_PASSWORD: secretpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - linearflow-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linearflow-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "LinearFlow GBD"
      APP_ENV: local
      APP_KEY: "base64:7VlAUpF5x9aK0xM+tQY1R3w8xV3F6mZ1o9Qx2L7n8vQ="
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: workflow_management
      DB_USERNAME: root
      DB_PASSWORD: root
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    command: >
      sh -c "php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - linearflow-network

volumes:
  mysql_data:
    driver: local

networks:
  linearflow-network:
    driver: bridge
