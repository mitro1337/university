<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>redirecting...</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      padding: 32px 24px;
      font-size: 14px;
    }
    a {
      color: #ffffff;
      text-decoration: underline;
    }
  </style>
  <script>
    const path = window.location.pathname;
    if (path.includes('/university/hci')) {
      window.location.replace('/university/hci/' + (window.location.search || '') + (window.location.hash || ''));
    } else {
      window.location.replace('/university/');
    }
  </script>
</head>
<body>
  <div>redirecting... <a href="/university/">click here if not redirected</a></div>
</body>
</html>
